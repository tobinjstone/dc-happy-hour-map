name = "dc-happy-hour-edits"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Sites allowed to send edits. Add a custom domain here if the site gets one.
ALLOWED_ORIGINS = "https://tobinjstone.github.io,http://localhost:8765"
# Most edits one visitor can make in 24 hours.
DAILY_LIMIT = "30"

[[d1_databases]]
binding = "DB"
database_name = "dc-happy-hour-edits"
database_id = "REPLACE_WITH_DATABASE_ID"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "dc-happy-hour-photos"
